name: Build iOS app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ChatApp.xcodeproj \
            -scheme ChatApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p artifact
          cp -R build/Build/Products/Debug-iphonesimulator/ChatApp.app artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-iOS-Simulator
          path: artifact/ChatApp.app
